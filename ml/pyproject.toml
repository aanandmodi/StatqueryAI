[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "satquery-ml"
version = "0.1.0"
description = "Training, evaluation and inference utilities for SatQuery specialists"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "rasterio>=1.4,<2",
]

[project.optional-dependencies]
train = [
  "accelerate==1.7.0",
  "bitsandbytes>=0.46,<1",
  "datasets>=3.6,<5",
  "evaluate>=0.4,<1",
  "huggingface-hub>=0.33,<1",
  "peft==0.17.1",
  "safetensors>=0.5,<1",
  "scikit-learn>=1.6,<2",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==4.57.0",
]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
satquery-ml = "satquery_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["satquery_ml"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
